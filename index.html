<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Plat Nomor App</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  @font-face {
    font-family: 'FE-Schrift';
    src: url('./FE.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }
  :root{
    --bg:#0f1115;
    --card:#171a21;
    --card2:#1e222b;
    --border:#2a2f3a;
    --text:#e6e8ee;
    --muted:#8b93a7;
    --accent:#4f8cff;
    --danger:#ef4444;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none !important}
  body{
    margin:0;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(1000px 500px at 15% -10%, #1b2a4a 0%, transparent 60%), var(--bg);
    color:var(--text);
    min-height:100vh;
    padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)) 16px;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1080px;margin:0 auto}
  .header{margin-bottom:18px}
  .header h1{margin:0;font-size:22px;letter-spacing:.3px}
  .header p{margin:4px 0 0;font-size:13px;color:var(--muted)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media (max-width:880px){.grid{grid-template-columns:1fr}}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .card-title{margin:0 0 14px;font-size:14px;font-weight:700;color:#cfd5e4;text-transform:uppercase;letter-spacing:1px}
  .card-head .card-title{margin:0}

  /* Upload */
  .drop{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    border:2px dashed var(--border);border-radius:12px;
    padding:26px 16px;min-height:180px;cursor:pointer;
    background:var(--card2);transition:.2s;overflow:hidden;text-align:center;
  }
  .drop:hover,.drop.dragover{border-color:var(--accent);background:#1b2130}
  .drop .icon{font-size:34px;line-height:1}
  .drop strong{font-size:14px}
  .drop span{font-size:12px;color:var(--muted)}
  .preview{max-width:100%;max-height:280px;border-radius:10px;display:block}

  /* Form */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .field input,.field select{
    width:100%;padding:12px 13px;border-radius:10px;
    background:var(--card2);border:1px solid var(--border);
    color:var(--text);font-size:15px;outline:none;transition:.15s;
    font-family:inherit;
  }
  .field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.15)}
  .field input[type="color"]{padding:4px;width:55px;height:44px;cursor:pointer;flex-shrink:0;}
  .field input[type="color"]::-webkit-color-swatch-wrapper{padding:0;}
  .field input[type="color"]::-webkit-color-swatch{border:1px solid var(--border);border-radius:6px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .preview-label{font-size:12px;color:var(--muted);font-weight:600;margin:6px 0 8px}
  .image-wrap{
    position:relative;
    display:inline-block;
    max-width:100%;
    margin-top:12px;
  }
  .image-wrap .preview{
    display:block;
    max-width:100%;
    max-height:400px;
    border-radius:10px;
  }
  .plate-overlay{
    position:absolute;
    top: 75%;
    left: 50%;
    transform: translate(-50%, -50%);
    cursor:move;
    user-select:none;
    touch-action:none;
  }
  .drag-hint{
    font-size:11px;
    color:var(--accent);
    margin-top:8px;
    text-align:center;
    font-weight:600;
  }
  
  .ai-status-connected { background: rgba(34, 197, 94, 0.2) !important; color: #22c55e !important; }
  .ai-status-error { background: rgba(239, 68, 68, 0.2) !important; color: #ef4444 !important; }
  .ai-status-loading { background: rgba(79, 140, 255, 0.2) !important; color: #4f8cff !important; }
  
  .plate{
    border-radius:12px; padding:2px 0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family: 'FE-Schrift', 'Bahnschrift', 'DIN Alternate', 'Arial Black', sans-serif;
    font-weight: 900; line-height:1;
    border: 4px solid var(--plate-border, #111);
    box-shadow: inset 0 0 0 2px var(--plate-inner, #fff), 0 4px 12px rgba(0,0,0,0.6);
    margin:0 !important;
    background: var(--plate-bg, #f4f6f8); 
    color: var(--plate-color, #111);
    width: 230px;
    height: 75px;
    position: absolute;
    overflow: hidden;
    --noise-opacity: 0.15;
    --plate-blur: 0px;
    filter: blur(var(--plate-blur));
    transition: background 0.2s, color 0.2s;
  }
  .plate::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)"/></svg>');
    opacity: var(--noise-opacity);
    mix-blend-mode: multiply;
    pointer-events: none;
    z-index: 1;
  }
  .plate-text{
    position: relative;
    display: inline-block;
    transform-origin: center center;
    font-family: 'FE-Schrift', 'Arial Black', Impact, sans-serif;
    font-size: 38px; 
    letter-spacing: 1px; 
    word-spacing: 12px; 
    margin-bottom: 0; font-weight: normal; z-index: 2;
    -webkit-text-stroke: 0px; 
    text-shadow: none;
  }
  .plate-year{
    position: relative;
    display: inline-block;
    transform-origin: center center;
    font-family: 'FE-Schrift', Arial, Helvetica, sans-serif;
    font-size: 15px; font-weight: normal; letter-spacing: 2px; opacity: 1; white-space:nowrap; margin-top:2px; z-index: 2;
    -webkit-text-stroke: 0px;
    text-shadow: none;
  }

  .btn-primary{
    width:100%;padding:14px;border:none;border-radius:11px;
    background:linear-gradient(135deg,#4f8cff,#3b6fe0);
    color:#fff;font-weight:700;font-size:15px;cursor:pointer;
    transition:.15s;font-family:inherit;
  }
  .btn-primary:hover{filter:brightness(1.08)}
  .btn-primary:active{transform:scale(.985)}
  .btn-ghost{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;
    transition:.15s;
  }
  .btn-ghost:hover{color:var(--danger);border-color:var(--danger)}

  /* List */
  .list{display:flex;flex-direction:column;gap:10px}
  .item{
    display:flex;align-items:center;gap:12px;
    padding:10px;background:var(--card2);
    border:1px solid var(--border);border-radius:12px;
    animation:pop .2s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .thumb{width:66px;height:50px;object-fit:cover;border-radius:8px;flex-shrink:0;background:#0b0d12;border:1px solid var(--border)}
  .thumb-ph{display:flex;align-items:center;justify-content:center;font-size:22px}
  .item-body{flex:1;min-width:0}
  .plate-chip{
    display:inline-block;padding:4px 10px;border-radius:6px;
    font-weight:800;font-size:14px;letter-spacing:1px;
    border:2px solid rgba(0,0,0,.2);
    max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .meta{font-size:12px;color:var(--muted);margin-top:6px}
  .del{
    background:transparent;border:1px solid var(--border);color:var(--muted);
    width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:14px;
    flex-shrink:0;transition:.15s;font-family:inherit;
  }
  .del:hover{color:var(--danger);border-color:var(--danger)}
  .empty{
    text-align:center;color:var(--muted);font-size:13px;
    padding:34px 10px;border:1px dashed var(--border);border-radius:12px;
  }

  /* Toast */
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);
    background:#22c55e;color:#fff;padding:11px 20px;border-radius:999px;
    font-size:14px;font-weight:600;opacity:0;transition:.3s;
    pointer-events:none;z-index:99;box-shadow:0 8px 20px rgba(0,0,0,.35);
    max-width:90vw;text-align:center;
  }
  .toast.show{transform:translate(-50%,0);opacity:1}
  .toast.err{background:var(--danger)}
  
  #previewModal canvas { width: 100%; border-radius: 8px; border: 1px solid var(--border); display: block; }
  @media (max-width: 600px) { #previewContainer { grid-template-columns: 1fr !important; } }
</style>
</head>
<body>
<div class="app">

  <header class="header">
    <h1>🚘 Plat Nomor App</h1>
    <p>Import gambar mobil, atur plat, lalu simpan datanya.</p>
  </header>

  <main class="grid">

    <!-- KOLOM KIRI -->
    <div>
      <section class="card">
        <h2 class="card-title">1 · Import Gambar</h2>
        <div class="field" style="margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label for="viewSelect">Pilih Sudut Pandang Mobil</label>
            <label style="font-size:11px; color:var(--muted); cursor:pointer; display:flex; align-items:center; gap:4px;">
              <input type="checkbox" id="hidePlateChk" style="width:auto; margin:0;"> Sembunyikan Plat
            </label>
          </div>
          <select id="viewSelect" style="font-weight:bold; color:var(--accent);">
            <option value="depan">🚗 Tampak Depan</option>
            <option value="kiri">⬅️ Tampak Samping Kiri</option>
            <option value="kanan">➡️ Tampak Samping Kanan</option>
            <option value="belakang">🚙 Tampak Belakang</option>
          </select>
        </div>
        <label class="drop" id="drop">
          <input type="file" accept="image/*" id="fileInput" hidden>
          <div id="dropPlaceholder">
            <div class="icon">📷</div>
            <strong>Import Gambar Mobil</strong>
            <span>Klik atau seret gambar ke sini</span>
          </div>
          <div id="imageWrap" class="image-wrap" hidden>
            <img id="preview" class="preview" alt="Preview">
            <div class="plate plate-overlay" id="platePreview">
              <span class="plate-text" id="plateText">B 1234 XYZ</span>
              <span class="plate-year" id="plateYear">11•24</span>
            </div>
          </div>
          <div class="drag-hint" id="dragHint" hidden>👆 Geser plat untuk menyesuaikan posisi</div>
        </label>

        <div id="plateControls" style="margin-top:16px; display:none; background:var(--card2); padding:14px; border-radius:12px; border:1px solid var(--border);">
          <div class="field">
            <label for="scaleSlider" style="display:flex; justify-content:space-between; margin-bottom:4px;">Ukuran Plat <span id="scaleVal" style="color:var(--accent);">100%</span></label>
            <input type="range" id="scaleSlider" min="10" max="200" value="100" style="padding:0;">
          </div>
          <div class="field">
            <label for="rotateSlider" style="display:flex; justify-content:space-between; margin-bottom:4px;">Kemiringan <span id="rotateVal" style="color:var(--accent);">0°</span></label>
            <input type="range" id="rotateSlider" min="-45" max="45" value="0" style="padding:0;">
          </div>
          <div class="field">
            <label for="noiseSlider" style="display:flex; justify-content:space-between; margin-bottom:4px;">Efek Noise (Biar real) <span id="noiseVal" style="color:var(--accent);">15%</span></label>
            <input type="range" id="noiseSlider" min="0" max="100" value="15" style="padding:0;">
          </div>
          <div class="field">
            <label for="blurSlider" style="display:flex; justify-content:space-between; margin-bottom:4px;">Blur (Penyatu) <span id="blurVal" style="color:var(--accent);">0px</span></label>
            <input type="range" id="blurSlider" min="0" max="4" step="0.2" value="0" style="padding:0;">
          </div>
          <div class="field">
            <label for="nopolSizeSlider" style="display:flex; justify-content:space-between; margin-bottom:4px;">Ukuran Teks Nopol <span id="nopolSizeVal" style="color:var(--accent);">38px</span></label>
            <input type="range" id="nopolSizeSlider" min="8" max="70" value="38" style="padding:0;">
          </div>
          <div class="field">
            <label for="tahunSizeSlider" style="display:flex; justify-content:space-between; margin-bottom:4px;">Ukuran Teks Tahun <span id="tahunSizeVal" style="color:var(--accent);">16px</span></label>
            <input type="range" id="tahunSizeSlider" min="4" max="30" value="16" style="padding:0;">
          </div>
          <div class="field">
            <label for="tinggiSlider" style="display:flex; justify-content:space-between; margin-bottom:4px;">Tinggi Teks <span id="tinggiVal" style="color:var(--accent);">100%</span></label>
            <input type="range" id="tinggiSlider" min="50" max="150" value="100" style="padding:0;">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="thicknessSlider" style="display:flex; justify-content:space-between; margin-bottom:4px;">Ketebalan Teks <span id="thicknessVal" style="color:var(--accent);">1.5px</span></label>
            <input type="range" id="thicknessSlider" min="0" max="4" step="0.5" value="1.5" style="padding:0;">
          </div>
        </div>

        <div style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
          <button type="button" id="toggleAiBtn" class="btn-ghost" style="width:100%; font-size:13px; font-weight:bold; color:var(--text); border-color:#3b6fe0;">
            ⚙️ Pengaturan AI (Otomatis)
          </button>
          
          <div id="aiPanel" style="display:none; background:#15181f; padding:14px; border-radius:10px; margin-top:10px; border:1px solid #2a2f3a;">
            <div class="field">
              <label>AI Provider</label>
              <select id="aiProvider">
                <option value="gemini">Google Gemini</option>
                <option value="openai">OpenAI</option>
                <option value="anthropic">Anthropic (Claude)</option>
              </select>
            </div>
            <div class="field">
              <label>AI Model</label>
              <select id="aiModel">
                <option value="gemini-3.8-flash">Gemini 3.8 Flash (Rekomendasi)</option>
                <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                <option value="gpt-4o-mini">GPT-4o Mini</option>
                <option value="claude-3-haiku-20240307">Claude 3 Haiku</option>
              </select>
            </div>
            <div class="field">
              <label>API Key</label>
              <input type="password" id="aiApiKey" placeholder="Masukkan API Key...">
            </div>
            
            <div style="display:flex; gap:8px; margin-bottom:10px;">
              <button type="button" id="btnTestAi" class="btn-ghost" style="flex:1; font-size:11px; padding:8px;">Tes Koneksi</button>
              <div id="aiStatus" style="flex:1; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:bold; border-radius:8px; background:#2a2f3a; color:var(--muted);">Belum Dites</div>
            </div>
            
            <button type="button" id="btnRunAi" class="btn-primary" style="padding:10px; font-size:13px;">
              ✨ Deteksi Otomatis Sudut Ini
            </button>
          </div>
        </div>
      </section>

      <section class="card" id="templateCard">
        <h2 class="card-title" style="display:flex; justify-content:space-between;">
          2 · Atur Plat & Template
          <span id="templateStatus" style="font-size:10px; color:#ef4444; background:rgba(239,68,68,0.1); padding:4px 8px; border-radius:4px;">Belum Terkunci</span>
        </h2>

        <div class="field">
          <label for="nomor">Nomor Plat</label>
          <input id="nomor" type="text" placeholder="B 1234 XYZ" maxlength="15" autocomplete="off" spellcheck="false">
        </div>

        <div class="row">
          <div class="field">
            <label for="bulan">Bulan Plat</label>
            <input id="bulan" type="text" inputmode="numeric" placeholder="11" maxlength="2" autocomplete="off">
          </div>
          <div class="field">
            <label for="tahun">Tahun Plat</label>
            <input id="tahun" type="text" inputmode="numeric" placeholder="24" maxlength="2" autocomplete="off">
          </div>
        </div>

        <div class="field">
          <label for="warna">Warna Plat</label>
          <div style="display:flex; gap:12px; align-items:stretch;">
            <input type="color" id="warna" value="#ffffff">
            <select id="warnaPreset" style="flex:1;">
              <option value="#ffffff">Putih</option>
              <option value="#111111">Hitam</option>
              <option value="#f5c518">Kuning</option>
              <option value="#e63946">Merah</option>
              <option value="#2ecc71">Hijau</option>
              <option value="#3498db">Biru</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="warnaTeks">Warna Teks Plat</label>
          <input type="color" id="warnaTeks" value="#000000" style="width:100%; height:44px; cursor:pointer;">
        </div>

        <div id="setupActions">
          <button class="btn-primary" id="lockTemplateBtn" style="background:linear-gradient(135deg,#f59e0b,#d97706);">🔒 Kunci Template & Lanjut Bulk</button>
        </div>
        <div id="bulkActions" style="display:none; gap:10px;">
          <button class="btn-ghost" id="btnPreviewBulk" style="flex:1; border-color:var(--accent); color:var(--accent); font-weight:bold;">👁️ Preview</button>
          <button class="btn-primary" id="addBtn" style="flex:1;">+ Tambah ke Bulk</button>
        </div>
      </section>
    </div>

    <!-- KOLOM KANAN -->
    <div>
      <section class="card" id="bulkListCard" style="display:none;">
        <div class="card-head">
          <h2 class="card-title">Daftar Bulk & Export</h2>
          <button class="btn-ghost" id="btnExportZip" style="color:#22c55e; border-color:#22c55e; font-weight:bold;">📦 Export ZIP</button>
        </div>
        
        <div style="text-align:center; margin-bottom:15px; background:var(--card2); padding:10px; border-radius:12px; border:1px solid var(--border);">
          <img id="templateThumb" style="max-width:100%; max-height:120px; border-radius:8px; display:none; object-fit:contain;">
          <div style="font-size:11px; color:var(--muted); margin-top:5px;">Template Mobil Aktif</div>
        </div>

        <button id="unlockTemplateBtn" class="btn-ghost" style="width:100%; margin-bottom:10px; display:none;">🔓 Buka Kunci / Ganti Mobil</button>

        <div class="list" id="bulkList"></div>
      </section>

      <section class="card" id="savedListCard">
        <div class="card-head">
          <h2 class="card-title">Data Tersimpan</h2>
          <button class="btn-ghost" id="clearBtn">Hapus Semua</button>
        </div>
        <div class="list" id="list"></div>
      </section>
    </div>

  </main>
</div>

<div class="toast" id="toast"></div>

<!-- Modal Preview -->
<div id="previewModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999; flex-direction:column; align-items:center; padding:20px; overflow-y:auto;">
  <div style="width:100%; max-width:800px; background:var(--card); border-radius:14px; padding:20px; border:1px solid var(--border);">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="margin:0; font-size:18px; color:var(--text);">Preview Hasil</h2>
      <button id="closePreviewBtn" class="btn-ghost" style="color:var(--danger); border-color:var(--danger); font-weight:bold;">Tutup ✕</button>
    </div>
    <div id="previewContainer" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
      <!-- Canvases will be injected here -->
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);

  const STORAGE_KEY = "platNomorData";
  const BULK_STORAGE_KEY = "platBulkData";
  const TEMPLATE_STORAGE_KEY = "platTemplateData";

  let templateData = null;
  let bulkItems = [];

  const fileInput       = $("fileInput");
  const viewSelect      = $("viewSelect");
  const hidePlateChk    = $("hidePlateChk");
  const lockTemplateBtn = $("lockTemplateBtn");
  const templateStatus  = $("templateStatus");
  const bulkListCard    = $("bulkListCard");
  const bulkListEl      = $("bulkList");
  const toggleAiBtn     = $("toggleAiBtn");
  const aiPanel         = $("aiPanel");
  const aiProvider      = $("aiProvider");
  const aiModel         = $("aiModel");
  const aiApiKey        = $("aiApiKey");
  const btnTestAi       = $("btnTestAi");
  const btnRunAi        = $("btnRunAi");
  const aiStatus        = $("aiStatus");

  let currentView = "depan";
  let viewData = {
    depan: { img: null, left: "50%", top: "80%", scale: 100, rotate: 0, noise: 15, blur: 0, nopolSize: 38, tahunSize: 16, tinggi: 100, thickness: 1.5, hidden: false },
    kiri: { img: null, left: "50%", top: "80%", scale: 100, rotate: 0, noise: 15, blur: 0, nopolSize: 38, tahunSize: 16, tinggi: 100, thickness: 1.5, hidden: false },
    kanan: { img: null, left: "50%", top: "80%", scale: 100, rotate: 0, noise: 15, blur: 0, nopolSize: 38, tahunSize: 16, tinggi: 100, thickness: 1.5, hidden: false },
    belakang: { img: null, left: "50%", top: "80%", scale: 100, rotate: 0, noise: 15, blur: 0, nopolSize: 38, tahunSize: 16, tinggi: 100, thickness: 1.5, hidden: false }
  };
  
  const drop            = $("drop");
  const previewImg      = $("preview");

  /* ---------- Storage ---------- */
  function loadData() {

  /* ---------- Helper ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function isDark(hex) {
    const h = String(hex).replace("#", "");
    if (h.length !== 6) return false;
    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return (0.299 * r + 0.587 * g + 0.114 * b) < 140;
  }

  function showToast(msg, isError) {
    toastEl.textContent = msg;
    toastEl.classList.toggle("err", !!isError);

  /* ---------- State Management (Simpan/Load per Sudut) ---------- */
  function saveCurrentViewState() {
    if (imageWrap.hidden) return;
    
    viewData[currentView] = {
      img: viewData[currentView].img,

  }

  function loadViewState(view) {
    const state = viewData[view];

    if (state.img) {

      dragHint.hidden = false;
      dropPlaceholder.hidden = true;

      platePreview.style.left = state.left;
      platePreview.style.top = state.top;
      
      scaleSlider.value = state.scale;
      rotateSlider.value = state.rotate;
      noiseSlider.value = state.noise;
      blurSlider.value = state.blur;
      nopolSizeSlider.value = state.nopolSize;
      tahunSizeSlider.value = state.tahunSize;
      tinggiSlider.value = state.tinggi;
      thicknessSlider.value = state.thickness;
      
      scaleVal.textContent = state.scale + "%";
      rotateVal.textContent = state.rotate + "°";
      noiseVal.textContent = state.noise + "%";
      blurVal.textContent = state.blur + "px";
      nopolSizeVal.textContent = state.nopolSize + "px";
      tahunSizeVal.textContent = state.tahunSize + "px";
      tinggiVal.textContent = state.tinggi + "%";
      thicknessVal.textContent = state.thickness + "px";

      updatePlateTransform();
      platePreview.style.setProperty('--noise-opacity', state.noise / 100);
      platePreview.style.setProperty('--plate-blur', state.blur + "px");
      
      plateText.style.fontSize = state.nopolSize + "px";

      plateText.style.transform = `scaleY(${state.tinggi / 100})`;
      plateYear.style.transform = `scaleY(${state.tinggi / 100})`;
      
      hidePlateChk.checked = state.hidden || false;
      platePreview.style.opacity = hidePlateChk.checked ? "0" : "1";

      updatePreview();

      previewImg.removeAttribute("src");
      imageWrap.hidden = true;
      dragHint.hidden = true;
      dropPlaceholder.hidden = false;

      hidePlateChk.checked = false;

  }

  /* ---------- Gambar ---------- */
  function processFile(file) {
    if (!file) return;
    if (!file.type || !file.type.startsWith("image/")) {
      showToast("File harus berupa gambar", true);
      return;
    }

    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const MAX = 1000;
        let w = img.width, h = img.height;
        const scale = Math.min(1, MAX / w, MAX / h);
        w = Math.round(w * scale);
        h = Math.round(h * scale);

        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);

        currentImage = canvas.toDataURL("image/jpeg", 0.82);
        viewData[currentView].img = currentImage;

        previewImg.src = currentImage;
        imageWrap.hidden = false;
        dragHint.hidden = false;
        dropPlaceholder.hidden = true;

        platePreview.style.left = "50%";
        platePreview.style.top = "80%";
        plateYear.textContent = "11•24";
        
        scaleSlider.value = 100;
        rotateSlider.value = 0;
        noiseSlider.value = 15;
        blurSlider.value = 0;
        nopolSizeSlider.value = 38;
        tahunSizeSlider.value = 16;
        tinggiSlider.value = 100;
        thicknessSlider.value = 1.5;
        plateText.style.fontSize = "38px";
        plateYear.style.fontSize = "16px";
        plateText.style.transform = "scaleY(1)";
        plateYear.style.transform = "scaleY(1)";
        tinggiVal.textContent = "100%";
        thicknessVal.textContent = "1.5px";
        updatePlateTransform();
        platePreview.style.setProperty('--noise-opacity', 0.15);
        platePreview.style.setProperty('--plate-blur', "0px");
        noiseVal.textContent = "15%";
        blurVal.textContent = "0px";
        nopolSizeVal.textContent = "38px";
        tahunSizeVal.textContent = "16px";
        
        plateControls.style.display = "block";
        showToast("Silakan atur plat secara manual ✓", false);
      };
      img.onerror = () => showToast("Gambar tidak bisa dibaca", true);
      img.src = ev.target.result;
    };
    reader.onerror = () => showToast("Gagal membaca file", true);
    reader.readAsDataURL(file);
  }

  fileInput.addEventListener("change", e => {
    if (e.target.files && e.target.files[0]) processFile(e.target.files[0]);

  ["dragenter", "dragover"].forEach(evName => {

  });

  /* ---------- Pratinjau Plat ---------- */
  function updatePreview() {
    const nomor = nomorEl.value.trim() || "B 1234 XYZ";
    const bulan = bulanEl.value.trim() || "11";
    const tahun = tahunEl.value.trim() || "24";
    const warna = warnaEl.value;
    const warnaTeks = warnaTeksEl.value;
    const thickness = parseFloat(thicknessSlider.value);

    plateText.textContent = nomor;
    plateYear.textContent = bulan + "•" + tahun;
    
    platePreview.style.setProperty('--plate-bg', warna);
    platePreview.style.setProperty('--plate-color', warnaTeks);
    const isDarkColor = isDark(warna);
    platePreview.style.setProperty('--plate-border', isDarkColor ? "#333333" : "#111111");
    platePreview.style.setProperty('--plate-inner', isDarkColor ? "rgba(255,255,255,0.2)" : "#ffffff");
    
    plateText.style.color = warnaTeks;
    plateYear.style.color = warnaTeks;
    
    plateText.style.webkitTextStroke = thickness > 0 ? `${thickness * 0.5}px ${warnaTeks}` : "0px";
    plateYear.style.webkitTextStroke = thickness > 0 ? `${thickness * 0.3}px ${warnaTeks}` : "0px";
    
    plateText.style.textShadow = "none";
    plateYear.style.textShadow = "none";
  }

  bulanEl.addEventListener("input", () => {
    bulanEl.value = bulanEl.value.replace(/\D/g, "").slice(0, 2);

    tahunEl.value = tahunEl.value.replace(/\D/g, "").slice(0, 2);
    updatePreview();

    for (let i = 0; i < warnaPreset.options.length; i++) {

        warnaPreset.selectedIndex = i;
        matched = true;
        break;
      }

    if (!matched) warnaPreset.selectedIndex = -1;

  warnaPreset.addEventListener("change", () => {
    warnaEl.value = warnaPreset.value;

  /* ---------- Render Daftar ---------- */
  function render() {
    if (!items.length) {
      listEl.innerHTML = '<div class="empty">Belum ada data.<br>Tambahkan data pertamamu di sebelah kiri.</div>';
      return;

    listEl.innerHTML = items.map(it => {

      const thumb = it.image

      return `

          ${thumb}
          <div class="item-body">
            <span class="plate-chip" style="background:${esc(it.warna)};color:${dark ? "#fff" : "#111"}">

  /* ---------- Tambah Data ---------- */
  function tambahData() {
    if (!templateData) {
      showToast("Kunci template terlebih dahulu sebelum menambah bulk!", true);
      return;
    }

    const nomor = nomorEl.value.trim();
    const bulan = bulanEl.value.trim();
    const tahun = tahunEl.value.trim();

    if (!nomor) {
      showToast("Nomor plat belum diisi", true);
      nomorEl.focus();
      return;
    }

    const warna = warnaEl.value;
    const warnaTeks = warnaTeksEl.value;
    const warnaName = warnaPreset.selectedIndex >= 0 ? warnaPreset.options[warnaPreset.selectedIndex].textContent : "Kustom";

    bulkItems.push({
      nomor: nomor,
      bulan: bulan,
      tahun: tahun,
      warna: warna,
      warnaTeks: warnaTeks,
      warnaName: warnaName
    });

    if(saveBulkData() === false) {
       bulkItems.pop();
       return;
    }

    renderBulk();
    nomorEl.value = "";
    nomorEl.focus();
    showToast("Nopol ditambahkan ke antrean bulk ✓");

  /* ---------- Fitur Geser (Drag) Plat ---------- */
  let isDragging = false;
  let startX, startY, startLeft, startTop;

  platePreview.addEventListener("pointerdown", (e) => {
    if (imageWrap.hidden) return;
    e.preventDefault();
    e.stopPropagation();
    
    isDragging = true;
    platePreview.setPointerCapture(e.pointerId);
    
    startX = e.clientX;
    startY = e.clientY;
    
    const styleLeft = platePreview.style.left;
    const styleTop = platePreview.style.top;
    
    startLeft = styleLeft ? parseFloat(styleLeft) : 50;
    startTop = styleTop ? parseFloat(styleTop) : 82;
  });

  platePreview.addEventListener("pointermove", (e) => {
    if (!isDragging) return;
    
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    
    const rect = imageWrap.getBoundingClientRect();
    
    let deltaLeft = (dx / rect.width) * 100;
    let deltaTop = (dy / rect.height) * 100;
    
    let newLeft = startLeft + deltaLeft;
    let newTop = startTop + deltaTop;
    
    newLeft = Math.max(0, Math.min(100, newLeft));
    newTop = Math.max(0, Math.min(100, newTop));
    
    platePreview.style.left = newLeft + "%";
    platePreview.style.top = newTop + "%";
  });

  const endDrag = (e) => {
    if (!isDragging) return;
    isDragging = false;
    platePreview.releasePointerCapture(e.pointerId);
  };

  platePreview.addEventListener("pointerup", endDrag);
  platePreview.addEventListener("pointercancel", endDrag);

  /* ---------- Fitur Pengaturan Manual Plat ---------- */
  const plateControls = $("plateControls");
  const scaleSlider = $("scaleSlider");
  const rotateSlider = $("rotateSlider");
  const noiseSlider = $("noiseSlider");
  const blurSlider = $("blurSlider");
  
  const nopolSizeSlider = $("nopolSizeSlider");
  const tahunSizeSlider = $("tahunSizeSlider");
  const tinggiSlider = $("tinggiSlider");
  const thicknessSlider = $("thicknessSlider");
  
  const scaleVal = $("scaleVal");

  const noiseVal = $("noiseVal");
  const blurVal = $("blurVal");

  const tinggiVal = $("tinggiVal");

  function updatePlateTransform() {

    rotateVal.textContent = rotateSlider.value + "°";

     noiseVal.textContent = noiseSlider.value + "%";

  /* ---------- AI Logic ---------- */
  btnTestAi.addEventListener("click", async () => {
    const key = aiApiKey.value.trim();
    if (!key) return showToast("API Key kosong", true);
    
    aiStatus.className = "ai-status-loading";
    aiStatus.textContent = "Mengetes...";
    
    try {
      if (aiProvider.value === "gemini") {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${aiModel.value}:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: "Hello" }] }] })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);
      } else {
        throw new Error("Tes koneksi langsung dari browser hanya didukung penuh untuk Gemini. Provider lain mungkin diblokir CORS.");
      }
      aiStatus.className = "ai-status-connected";
      aiStatus.textContent = "Terhubung ✓";
    } catch (err) {
      aiStatus.className = "ai-status-error";
      aiStatus.textContent = "Gagal / Error";
      showToast(err.message, true);
    }
  });

  btnRunAi.addEventListener("click", async () => {
    if (!currentImage) return showToast("Import gambar dulu", true);
    const key = aiApiKey.value.trim();
    if (!key) return showToast("Isi API Key dulu", true);

    btnRunAi.textContent = "⏳ Memproses AI...";
    btnRunAi.disabled = true;

    try {
      if (aiProvider.value === "gemini") {
        const base64Data = currentImage.split(',')[1];
        const promptText = "Baca plat nomor pada gambar ini. Kembalikan HANYA format JSON murni tanpa markdown: {\"ymin\": 10, \"xmin\": 20, \"ymax\": 30, \"xmax\": 40}. 'ymin/xmin/ymax/xmax' adalah koordinat kotak plat dalam skala 0-1000. Jika tidak ada plat, isi -1.";

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${aiModel.value}:generateContent?key=${key}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: "image/jpeg", data: base64Data } }] }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        let resultText = data.candidates[0].content.parts[0].text;
        let result = JSON.parse(resultText);

        if (result.ymin === -1 || result.xmin === undefined) {
           hidePlateChk.checked = true;
           platePreview.style.opacity = "0";
           showToast("AI: Plat tidak terdeteksi, disembunyikan.", false);
        } else {
           hidePlateChk.checked = false;
           platePreview.style.opacity = "1";
           
           const left = result.xmin / 10;
           const top = result.ymin / 10;
           const width = (result.xmax - result.xmin) / 10;
           
           platePreview.style.left = (left + (width/2)) + "%";
           platePreview.style.top = (top + ((result.ymax - result.ymin)/20)) + "%";
           
           const imgWidth = previewImg.clientWidth;
           const plateWidthPx = (width / 100) * imgWidth;
           
           let newScale = Math.round((plateWidthPx / 230) * 100);
           newScale = Math.max(10, Math.min(200, newScale));
           
           scaleSlider.value = newScale;
           scaleVal.textContent = newScale + "%";
           updatePlateTransform();

           showToast("AI berhasil menyesuaikan plat ✓", false);
        }
      } else {
         showToast("Provider selain Gemini butuh backend (CORS).", true);
      }
    } catch (err) {
      console.error(err);
      showToast("Gagal AI: " + err.message, true);
    } finally {
      btnRunAi.textContent = "✨ Deteksi Otomatis Sudut Ini";
      btnRunAi.disabled = false;
    }
  });

  /* ---------- Render Canvas & Preview / Export ---------- */
  async function renderPlateToCanvas(imgSrc, state, plate, canvas) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const ctx = canvas.getContext('2d');
        const scale = Math.min(1, 1200 / img.width, 1200 / img.height);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const pX = (parseFloat(state.left || 50) / 100) * canvas.width;
        const pY = (parseFloat(state.top || 80) / 100) * canvas.height;
        const pScale = (state.scale || 100) / 100;
        const pRot = ((state.rotate || 0) * Math.PI) / 180;
        
        ctx.save();
        ctx.translate(pX, pY);
        ctx.rotate(pRot);
        ctx.scale(pScale, pScale);
        
        const pW = 230;
        const pH = 75;
        
        ctx.fillStyle = plate.warna;
        ctx.beginPath();
        if(ctx.roundRect) {
          ctx.roundRect(-pW/2, -pH/2, pW, pH, 12);
        } else {
          ctx.rect(-pW/2, -pH/2, pW, pH);
        }
        ctx.fill();
        
        ctx.lineWidth = 4;
        ctx.strokeStyle = isDark(plate.warna) ? "#333333" : "#111111";
        ctx.stroke();
        
        ctx.lineWidth = 2;
        ctx.strokeStyle = isDark(plate.warna) ? "rgba(255,255,255,0.2)" : "#ffffff";
        ctx.beginPath();
        if(ctx.roundRect) {
          ctx.roundRect(-pW/2 + 2, -pH/2 + 2, pW - 4, pH - 4, 10);
        } else {
          ctx.rect(-pW/2 + 2, -pH/2 + 2, pW - 4, pH - 4);
        }
        ctx.stroke();
        
        ctx.fillStyle = plate.warnaTeks || (isDark(plate.warna) ? "#ffffff" : "#000000");
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        
        const nopolScaleY = (state.tinggi || 100) / 100;
        ctx.save();
        ctx.translate(0, -pH/2 + 28);
        ctx.scale(1, nopolScaleY);
        ctx.font = `900 ${state.nopolSize || 38}px 'FE-Schrift', Arial, sans-serif`;
        if (state.thickness > 0) {
          ctx.lineWidth = state.thickness;
          ctx.strokeStyle = ctx.fillStyle;
          ctx.strokeText(plate.nomor, 0, 0);
        }
        ctx.fillText(plate.nomor, 0, 0);
        ctx.restore();
        
        const yearScaleY = (state.tinggi || 100) / 100;
        ctx.save();
        ctx.translate(0, pH/2 - 15);
        ctx.scale(1, yearScaleY);
        ctx.font = `900 ${state.tahunSize || 16}px 'FE-Schrift', Arial, sans-serif`;
        const yearStr = plate.bulan + "•" + plate.tahun;
        if (state.thickness > 0) {
          ctx.lineWidth = state.thickness * 0.6;
          ctx.strokeStyle = ctx.fillStyle;
          ctx.strokeText(yearStr, 0, 0);
        }
        ctx.fillText(yearStr, 0, 0);
        ctx.restore();
        
        ctx.restore();
        resolve();
      };
      img.src = imgSrc;
    });
  }

  $("btnPreviewBulk").addEventListener("click", async () => {
    if (!templateData) return;
    const tempPlate = {
      nomor: nomorEl.value.trim() || "B 1234 XYZ",
      bulan: bulanEl.value.trim() || "11",
      tahun: tahunEl.value.trim() || "24",
      warna: warnaEl.value,
      warnaTeks: warnaTeksEl.value
    };
    
    $("previewModal").style.display = "flex";
    const container = $("previewContainer");
    container.innerHTML = "<div style='color:#fff; text-align:center; grid-column:span 2;'>Memproses...</div>";
    
    const views = ["depan", "kiri", "kanan", "belakang"];
    container.innerHTML = "";
    
    for (let v of views) {
      const state = templateData[v];
      if (!state || !state.img || state.hidden) continue;
      
      const div = document.createElement("div");
      div.innerHTML = `<div style="font-size:12px; color:var(--muted); margin-bottom:4px; text-transform:capitalize;">${v}</div>`;
      const canvas = document.createElement("canvas");
      div.appendChild(canvas);
      container.appendChild(div);
      
      await renderPlateToCanvas(state.img, state, tempPlate, canvas);
    }
  });

  $("closePreviewBtn").addEventListener("click", () => {
    $("previewModal").style.display = "none";
  });

  $("btnExportZip").addEventListener("click", async () => {
    if (!bulkItems.length) return showToast("Belum ada data bulk", true);
    if (!templateData) return;
    
    $("btnExportZip").textContent = "⏳ Memproses...";
    $("btnExportZip").disabled = true;
    
    try {
      const zip = new JSZip();
      const folderHasil = zip.folder("Hasil");
      
      for (let i = 0; i < bulkItems.length; i++) {
        const plate = bulkItems[i];
        const safeNopol = plate.nomor.replace(/[^a-zA-Z0-9]/g, "");
        const folderNopol = folderHasil.folder(safeNopol || `Plat_${i}`);
        
        const views = ["depan", "kiri", "kanan", "belakang"];
        for (let v of views) {
          const state = templateData[v];
          if (!state || !state.img || state.hidden) continue;
          
          const canvas = document.createElement("canvas");
          await renderPlateToCanvas(state.img, state, plate, canvas);
          
          const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.9));
          folderNopol.file(`${safeNopol}_${v}.jpg`, blob);
        }
      }
      
      const content = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(content);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Hasil_Edit_Plat.zip";
      a.click();
      URL.revokeObjectURL(url);
      
      showToast("Export berhasil di-download!");
    } catch (err) {
      console.error(err);
      showToast("Gagal export ZIP", true);
    } finally {
      $("btnExportZip").textContent = "📦 Export ZIP";
      $("btnExportZip").disabled = false;
    }
  });

  /* ---------- Init ---------- */
  updatePreview();
  render();
  loadBulkData();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker aktif!'))
        .catch(err => console.log('Service Worker gagal:', err));
    });
  }

  function updateStatusBar() {
    let metaThemeColor = document.querySelector('meta[name="theme-color"]');
    if (!metaThemeColor) {
      metaThemeColor = document.createElement('meta');
      metaThemeColor.name = "theme-color";
      document.head.appendChild(metaThemeColor);
    }
    metaThemeColor.setAttribute('content', '#0f1115');
  }
  
  updateStatusBar();

})();
</script>
